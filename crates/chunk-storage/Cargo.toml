[package]
name = "rc-chunk-storage"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rc-core = { path = "../core" }
rc-nbt = { path = "../nbt" }
rc-registries = { path = "../registries" }
bevy_ecs = { workspace = true }
flate2 = { workspace = true }             # M2-B03 — WORLD-D13 Zlib
lz4_flex = { workspace = true }           # M2-B03 — WORLD-D13 LZ4
parking_lot = { workspace = true }        # M2-B03 — WORLD-D12 per-handle lock
thiserror = { workspace = true }          # M2-B03 — StorageError

# `io-uring` is a Linux io_uring syscall wrapper and does not compile at all
# on non-Linux targets (it is not merely inert there). Scoping it to a
# `target.cfg` dependency table (rather than a plain optional dependency) is
# the standard way to keep the `dep:io-uring` feature reference valid on
# every platform while never even attempting to build the crate off Linux —
# required for `cargo build --workspace --all-features` to succeed on
# windows-2025 CI (TEST-D43's two-OS matrix).
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[features]
io_uring = ["dep:io-uring"]
