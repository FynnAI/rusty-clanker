[package]
name = "rc-gametest"
version.workspace = true
edition.workspace = true
publish = false

# Forced deviation from this blueprint's own Deliverables sketch (final report has the
# full citation): this crate never depends on `rc-paritybot`. `rc-paritybot` carries an
# unconditional, non-optional `azalea` dependency (`crates/testing/paritybot/Cargo.toml`)
# requiring azalea's own nightly-only `rust-toolchain.toml` override to build at all
# (verified live per that crate's own doc comments and `xtask/Cargo.toml`'s identical
# warning) -- any crate that depends on `rc-paritybot` therefore also becomes
# nightly-only to build, which would break every workspace-wide, stable-toolchain-pinned
# sweep this crate must participate in unmodified (`xtask::test`/`xtask::lint`'s own
# `--workspace` scans, which already `--exclude rc-paritybot` specifically so the *rest*
# of the workspace keeps building under WS-D4's pinned stable toolchain -- `rc-gametest`
# is not on that exclude list and must not need to be). The two orchestration functions
# that actually need a live, azalea-backed bot connection (`capture_contraption`,
# `run_full_corpus_capture`) therefore live in `rc-paritybot` itself instead (new
# `corpus_capture` module + `fetch_corpus_runner` bin target), calling back into this
# crate's own azalea-free `capture`/`trace`/`spec` items -- see that crate's own module
# doc comment for the full mechanism (mirrors `idle_stability_runner`/
# `restart_persistence_runner`'s already-established subprocess pattern exactly).
[dependencies]
rc-core = { path = "../../core" }
rc-chunk-storage = { path = "../../chunk-storage" }
rc-messaging = { path = "../../messaging" }
# `default-features = false` is NOT used here (a second forced deviation, final report):
# current `rc-mechanics::lib.rs` gates its entire `stage4` module -- not merely
# `stage4::ecs` -- behind `feature = "server-systems"`, so `stage4::run_scheduled_phase`/
# `run_block_event_subphase` (this crate's whole reason for depending on `rc-mechanics`)
# are unavailable without it. `replay.rs` never touches `stage4::ecs`/`bevy_ecs::World`/
# `rc-scheduler` directly regardless of which features are enabled -- only the two
# ECS-agnostic core functions -- so this costs extra compile surface, never a behavioral
# difference from the blueprint's own "ECS-agnostic core, never the ecs adapter" intent.
rc-mechanics = { path = "../../mechanics" }
serde = { workspace = true }
ron = { workspace = true }
postcard = { workspace = true }
thiserror = { workspace = true }

# `spec_loading.rs`'s own `manifest_verifies_clean_against_the_five_shipped_ron_files`
# case reuses `xtask::fixture_manifest::verify_manifest` unmodified (Prerequisites,
# M0-B07) rather than re-implementing manifest verification a second time. Cargo
# explicitly permits this dev-dependency direction even though `xtask` itself depends
# on this crate normally (Deliverables, `xtask/Cargo.toml`) -- a cycle through
# `[dev-dependencies]` only never affects either crate's own build artifact.
[dev-dependencies]
xtask = { path = "../../../xtask" }
