[package]
name = "rc-paritybot"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rc-test-harness = { path = "../test-harness" }
# In-workspace only, not a new external dependency (Constraint (c) restated in this
# crate's own bin-target doc comment governs *external* deps) — `vanilla_registry_
# defaults`'s relay needs `rc-protocol`'s own frame/varint/packet primitives directly,
# the same already-precedented use `rc-test-harness/src/fake_server.rs` makes of it.
rc-protocol = { path = "../../protocol" }
bytes = { workspace = true }
tokio = { workspace = true }
azalea = { workspace = true } # TEST-D8 — git dependency, see 12-workspace-structure.md
# M3 field-report harness (`xtask placement-diff`): `placement_capture`'s own
# `ItemStack::new`/`ItemStackData` construction for `ServerboundSetCreativeModeSlot` —
# the root workspace `Cargo.toml`'s own doc comment on this dependency has the full
# "already transitively pulled in by `azalea`, same pinned rev" justification.
azalea-inventory = { workspace = true }
thiserror = { workspace = true }
# M2-B08: `restart_persistence::ExpectedState`'s own `BlockPos`/`DimensionId` fields
# (in-workspace only, mirrors `rc-protocol`'s own identical justification above).
rc-core = { path = "../../core" }
# M2-B08: `expected_state()`'s fixed script targets vanilla's real `minecraft:stone`/
# `minecraft:air` block-state ids (Context's "Defined block pattern") — read directly
# off the generated registry table (`M0-B07`'s own output) rather than duplicating
# their numeric value by hand.
rc-registries = { path = "../../registries" }
# M3-B07: `corpus_capture`'s own azalea-free half (`OracleServerHandle`/
# `launch_oracle_server`/`send_console_command`/`check_state_id_consistency`, plus
# `ContraptionSpec`/`RedstoneTrace`) lives in `rc-gametest` — this crate is already
# nightly-only (azalea, above), so depending on it here carries no additional
# toolchain cost, unlike the reverse edge (`rc-gametest`'s own `Cargo.toml` doc
# comment explains why that direction is forbidden).
rc-gametest = { path = "../gametest" }
# M3-B07: `packet_capture::extract_comparator_output`'s own `NbtCompound::int` read
# off a `ClientboundBlockEntityData` packet's `tag: simdnbt::owned::Nbt` field —
# in-workspace only (already pinned, `crates/nbt/Cargo.toml`; the exact version
# azalea itself already depends on transitively, so this adds no new version to the
# dependency graph).
simdnbt = { workspace = true }

[dev-dependencies]
# M3 field-report fix (DEFECT 3): `restart_persistence_self_tests.rs`'s own aim-geometry
# regression test hand-verifies `restart_persistence::click_aim_point` against a *real*
# `rc_physics::cast_ray` (the exact algorithm `crates/server/src/play/mining.rs::
# raycast_reach` uses) over a small in-test `BlockShapeSource` mirroring M1-B05's superflat
# layer table — not a second, potentially-drifting reimplementation of the raycast itself.
# Test-only: `rusty-clanker-server` already depends on `rc-physics` directly; this crate's
# own library code never does.
rc-physics = { path = "../../physics" }

# Forced deviation (Context, "azalea's own upstream nightly-toolchain requirement"):
# `xtask`'s own binary must never gain a Cargo dependency edge on this crate --
# azalea's own `rust-toolchain.toml` pins `channel = "nightly"` (its transitive
# `simdnbt` dependency unconditionally uses `#![feature(portable_simd)]`, verified
# live against the pinned rev, August 2026), and every other Tier-1 CI gate compiles
# `xtask.exe` under this project's own pinned *stable* toolchain (WS-D4). `xtask
# m1-report` therefore drives this scenario as a subprocess (`std::process::Command`,
# `RUSTC_BOOTSTRAP=1` set on the child) rather than an in-process
# `rc_paritybot::idle_stability` call — this bin target is that subprocess's entry
# point.
[[bin]]
name = "idle_stability_runner"
path = "src/bin/idle_stability_runner.rs"

# M2-B08's own necessary addition, following the exact same forced-deviation
# precedent as `idle_stability_runner` above (this blueprint's own `m2_report.rs`
# Deliverables sketch — an in-process `tokio::runtime::Runtime`/`block_on` call into
# `rc_paritybot::restart_persistence` directly from `xtask` — is impossible for the
# identical reason: `xtask.exe` must never link `azalea`). `xtask m2-report` drives
# the restart-round-trip leg's `apply_actions`/`observe_state` calls by spawning this
# binary as a real OS subprocess instead.
[[bin]]
name = "restart_persistence_runner"
path = "src/bin/restart_persistence_runner.rs"

# M3-B07's own necessary addition, identical forced-deviation precedent to the two
# bin targets above: `xtask corpus::fetch_corpus` drives `corpus_capture::
# run_full_corpus_capture` by spawning this binary as a real OS subprocess.
[[bin]]
name = "fetch_corpus_runner"
path = "src/bin/fetch_corpus_runner.rs"

# M3-B08's own necessary addition, identical forced-deviation precedent to the three
# bin targets above: `xtask m3_report` drives `load_scenario::run_load_scenario` by
# spawning this binary as a real OS subprocess.
[[bin]]
name = "load_scenario_runner"
path = "src/bin/load_scenario_runner.rs"

# M3 field-report harness (governance changeset, "a placement differential harness"):
# `xtask placement-diff` drives `placement_capture::run_capture` (against either a real
# oracle or our own real server) by spawning this binary as a real OS subprocess,
# identical forced-deviation precedent to the four bin targets above.
[[bin]]
name = "placement_diff_runner"
path = "src/bin/placement_diff_runner.rs"
