[package]
name = "rc-test-harness"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# Forced deviation from this blueprint's own Deliverables manifest sketch (which lists
# only serde_json/thiserror): Implementation steps 3 and 5 explicitly instruct
# `probe.rs`/`fake_server.rs` to "use rc_protocol's frame/varint/wire primitives
# directly (M1-B01's public API)" -- impossible without this dependency. Recorded as a
# forced deviation in this blueprint's implementation commit body/report.
rc-protocol = { path = "../../protocol" }
serde_json = { workspace = true }
thiserror = { workspace = true }
# M2-B08: `chunk_soak.rs`/`fixtures/corrupting_backend.rs` drive `rc_chunk_storage`'s
# real `ChunkStorageBackend`/`AnvilDiskBackend`/palette types directly (in-process,
# synchronous -- no new async-runtime dependency, Constraint (f)).
rc-chunk-storage = { path = "../../chunk-storage" }
rc-nbt = { path = "../../nbt" }
rc-core = { path = "../../core" }
# M2-B08's own one permitted new external dependency (Constraint (c)): deterministic
# PRNG for `chunk_soak::generate_chunk_payload`. Only `rand_chacha` itself is added --
# its own re-exported `rand_chacha::rand_core` (the crate it already depends on) is
# used for the `RngCore`/`SeedableRng` traits, avoiding a second new dependency on
# `rand_core` directly.
rand_chacha = { workspace = true }
# M2-B08: `save_cadence::SaveEvent` derives `serde::Deserialize` (Deliverables) --
# `serde_json` alone (already a dependency, used only for its `from_str`/`to_string`
# free functions) does not itself provide the `Deserialize` derive macro.
serde = { workspace = true }

[[bin]]
name = "status_probe"
path = "src/bin/status_probe.rs"

# M3-B08: a tiny, real, standalone subprocess (`tick_cadence.rs`'s own doc comment
# has the full usage contract) used only by this blueprint's own Tier-1 self tests to
# prove the tick-log analysis pipeline against an actual foreign process before it is
# ever trusted against a real `rusty-clanker-server`.
[[bin]]
name = "fixture_tick_writer"
path = "src/bin/fixture_tick_writer.rs"

[features]
# M0-B06/M1-B05's own established convention (`rc-scheduler`, `rusty-clanker-server`,
# `rc-chunk-storage`): Tier-2-only (nightly), real-wall-clock soak tests are gated
# behind this feature so the default Tier-1 `cargo nextest run --workspace` sweep
# (`xtask test`) never even compiles them. Gates `tests/chunk_soak_10000.rs`.
soak-tests = []
