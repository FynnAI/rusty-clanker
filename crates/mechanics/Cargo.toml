[package]
name = "rc-mechanics"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rc-core = { path = "../core" }
rc-messaging = { path = "../messaging" }
rc-chunk-storage = { path = "../chunk-storage" }
# M3 field-report fix ("production never wires redstone"): `redstone::dispatch_ranges` cross-
# checks the tier-1/piston dispatch ranges' own internal state-id arithmetic against
# `rc-registries`' generated `default_state` table at startup. WS-D3 rule 1 lists `rc-registries`
# as `Shared` (reachable by both binaries), not `NETRENDER` (WS-D3 rule 2's forbidden list for
# this crate), and `12-workspace-structure.md`'s own WS-D13 rationale already anticipates exactly
# this edge ("Registry data must be reachable by crates that may never depend on rc-protocol...
# rc-scheduler/rc-mechanics") -- this dependency is therefore sanctioned, not a new exception.
rc-registries = { path = "../registries" }
# M3-B06: block-entity NBT codecs (chest/furnace/hopper). Already workspace-pinned (M2-B02)
# and already reachable via `rc-chunk-storage` -- crosses no `SIM`/`NETRENDER` boundary
# (`xtask lint-deps` Rule 2).
rc-nbt = { path = "../nbt" }
# WS-D3 rule 1: `rc-physics` must stay reachable from *both* `rusty-clanker-server` and
# `rusty-clanker-client`'s transitive dependency closures. `rusty-clanker-client` depends on it
# directly; `rusty-clanker-server` does not (Deviations) -- this crate is its only other path,
# so this edge is kept even though M3-B01's own Cargo.toml sample omits it.
rc-physics = { path = "../physics" }
bevy_ecs = { workspace = true }
tracing = { workspace = true } # defect-2 fix -- rate-limited chain_limit_hit diagnostic, neighbor_update.rs
# M4-B01: `rc-entity-macros`' first real derive use (`EntityNbtFields`/`EntityMetadataFields`,
# MECH-D30) -- unconditional (not `server-systems`-gated), since component definitions are
# needed by both the server-tick and the client-prediction subset.
rc-entity-macros = { path = "../entity-macros" }
serde = { workspace = true }
postcard = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

[dependencies.rc-scheduler]
path = "../scheduler"
optional = true

[dev-dependencies]
proptest = { workspace = true }

[features]
default = ["server-systems"]
server-systems = ["dep:rc-scheduler"]
client-predict = []
