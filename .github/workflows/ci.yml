name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      m1_report_mode:
        description: "m1-acceptance report mode when manually triggered"
        type: choice
        options: [smoke, full]
        default: smoke
      m2_report_mode:
        description: "m2-acceptance report mode when manually triggered"
        type: choice
        options: [smoke, full]
        default: smoke
      m3_report_mode:
        description: "m3-acceptance report mode when manually triggered"
        type: choice
        options: [smoke, full]
        default: smoke
  schedule:
    # TEST-D37 Tier 2, nightly: M0's own headline acceptance criterion 1 (M0-B06's
    # soak-tests-gated soak_8_regions_stable_20tps_10min), the only real Tier-2-shaped
    # content M0 has (Context: "TEST-D37 restated"). Also gates the M1-B06
    # `m1-acceptance` job below (always `smoke` mode on this automatic cadence).
    - cron: "0 7 * * *"

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    # `RUSTC_BOOTSTRAP=1`: workspace-wide, since M2-B01. `simdnbt` 0.10.0 (rc-nbt's
    # real NBT backend, WORLD-D11) carries unconditional `#![feature(portable_simd)]`
    # with no `#[cfg]` guard in every published version (0.10.0 is latest, checked
    # 2026-08-26) -- every command touching rc-nbt or its dependents (rc-chunk-storage,
    # rc-protocol, rc-test-harness, xtask itself) fails E0554 on this workspace's
    # pinned *stable* toolchain otherwise. crates/nbt/Cargo.toml's own "KNOWN BLOCKER"
    # comment and every M2 blueprint report from M2-B02 onward already flag this as an
    # open, project-wide gap; the `m2-acceptance` job below already carries this same
    # env var locally per-step. Setting it once, job-wide, here is the M2 integration
    # pass's deliberate resolution so the actual required Tier-1 gates below can build
    # at all -- see M2-COMPLETION-REPORT.md for the full rationale.
    env:
      RUSTC_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-nextest binary
        id: nextest-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest*
          key: nextest-${{ matrix.os }}-0.9.143

      - name: Install cargo-nextest (WS-D10 pin)
        if: steps.nextest-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-nextest --locked --version 0.9.143

      - name: fmt-check
        run: cargo run -p xtask -- fmt-check

      - name: lint
        run: cargo run -p xtask -- lint

      - name: lint-deps
        run: cargo run -p xtask -- lint-deps

      # xtask's own tests run outside the xtask-driven verb: the verb executes
      # inside xtask.exe, and on Windows the inner cargo invocation cannot
      # relink the running binary (file lock, os error 5).
      - name: test (xtask self)
        run: cargo nextest run -p xtask

      - name: test
        run: cargo run -p xtask -- test

      - name: Upload machine-readable results (TEST-D40)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-results-${{ matrix.os }}
          path: |
            target/verify/*.json
            target/nextest/**/junit.xml
          if-no-files-found: warn

  guardrails:
    name: guardrails (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    # `RUSTC_BOOTSTRAP=1`: see the identical comment on the `gates` job above --
    # `verify-fixtures` and `lint-tests` both build against rc-chunk-storage/rc-nbt.
    env:
      RUSTC_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Determine base ref (TEST-D46)
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: path-guard
        shell: bash
        run: |
          if [ -n "${{ steps.base.outputs.sha }}" ]; then
            cargo run -p xtask -- path-guard --base "${{ steps.base.outputs.sha }}"
          else
            cargo run -p xtask -- path-guard
          fi

      - name: lint-tests
        shell: bash
        run: |
          if [ -n "${{ steps.base.outputs.sha }}" ]; then
            cargo run -p xtask -- lint-tests --base "${{ steps.base.outputs.sha }}"
          else
            cargo run -p xtask -- lint-tests
          fi

      - name: verify-fixtures
        run: cargo run -p xtask -- verify-fixtures

      - name: Upload machine-readable results (TEST-D40)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardrails-results-${{ matrix.os }}
          path: target/verify/*.json
          if-no-files-found: warn

  soak:
    name: soak (${{ matrix.os }})
    # TEST-D37 Tier 2: nightly cron only, never a PR/push gate — M0-B06's own
    # `soak-tests`-featured `soak_8_regions_stable_20tps_10min`, M0's headline
    # acceptance criterion 1. Not part of the required-status-check set TEST-D50's
    # branch-protection script names (`scripts/configure-branch-protection.sh`,
    # below) — a nightly job cannot block a same-day PR merge, per TEST-D37's own
    # "not PR-blocking" Tier-2 definition.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-nextest binary
        id: nextest-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest*
          key: nextest-${{ matrix.os }}-0.9.143

      - name: Install cargo-nextest (WS-D10 pin)
        if: steps.nextest-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-nextest --locked --version 0.9.143

      - name: soak_8_regions_stable_20tps_10min
        run: cargo nextest run -p rc-scheduler --features soak-tests -- soak_8_regions_stable_20tps_10min

      # `RUSTC_BOOTSTRAP=1`: see the identical comment on the `gates` job above --
      # `rc-test-harness` depends on `rc-nbt`/`rc-chunk-storage` (`simdnbt`'s
      # unconditional `#![feature(portable_simd)]`, this workspace's pinned *stable*
      # toolchain). `RC_SOAK_BUDGET_SECS=900`: this test's own default 180s wall-clock
      # budget is a local, low-contention-runner figure (Context); the nightly runner's
      # shared disk (this soak plus `anvil_soak_roundtrip` below, potentially
      # concurrent) is realistically slower, so this job overrides it to a
      # CI-runner-realistic budget rather than loosening the default every local run
      # gets.
      - name: chunk_soak_10000 (rc-test-harness)
        env:
          RUSTC_BOOTSTRAP: "1"
          RC_SOAK_BUDGET_SECS: "900"
        run: cargo nextest run -p rc-test-harness --features soak-tests -- soak_10000

      # `RUSTC_BOOTSTRAP=1`: same rationale as the step above -- `rc-chunk-storage`
      # itself depends on `rc-nbt`.
      - name: anvil_soak_roundtrip (rc-chunk-storage)
        env:
          RUSTC_BOOTSTRAP: "1"
        run: cargo nextest run -p rc-chunk-storage --features soak-tests -- ten_thousand_chunk_write_read_round_trips_have_zero_checksum_mismatches

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report-${{ matrix.os }}
          path: target/soak-report/region_soak_8x20tps.json
          if-no-files-found: warn

  m1-acceptance:
    name: m1-acceptance (${{ matrix.os }})
    # Nightly cron: always `smoke`. Manual dispatch: whatever `m1_report_mode` was
    # chosen (default `smoke`) — the real, uncompressed 30-minute `full` run is
    # deliberately never on the automatic nightly cadence (Context: manual/on-demand
    # is the one that closes M1, not a routine nightly cost).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    # `RUSTC_BOOTSTRAP=1`: see the identical comment on the `gates` job above --
    # `rusty-clanker-server` now depends on rc-chunk-storage/rc-nbt (M2-B05/M2-B07).
    env:
      RUSTC_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-nextest binary
        id: nextest-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest*
          key: nextest-${{ matrix.os }}-0.9.143

      - name: Install cargo-nextest (WS-D10 pin)
        if: steps.nextest-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-nextest --locked --version 0.9.143

      # `rc-paritybot`'s own transitive `azalea` dependency requires a nightly Rust
      # toolchain (Context, "azalea's own upstream nightly-toolchain requirement") --
      # this project's root `rust-toolchain.toml` stays pinned to stable (WS-D4) for
      # every other crate; `crates/testing/paritybot/`'s own nested
      # `rust-toolchain.toml` override supplies the nightly channel automatically for
      # any `cargo` invocation whose working directory is at or below that path
      # (every step below that touches `rc-paritybot` explicitly `cd`s there first).
      # That nested toolchain is real nightly already, so it does not need (and is
      # unaffected by) the job-level RUSTC_BOOTSTRAP=1 above.
      - name: rc-paritybot lint (nightly override)
        working-directory: crates/testing/paritybot
        run: cargo clippy --all-targets -- -D warnings

      - name: Build rusty-clanker-server (monolithic)
        run: cargo build --release -p rusty-clanker-server --no-default-features --features monolithic

      - name: rc-paritybot test (nightly override)
        working-directory: crates/testing/paritybot
        run: cargo nextest run

      - name: m1-report
        shell: bash
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.m1_report_mode || 'smoke' }}"
          cargo run -p xtask -- m1-report --server-bin target/release/rusty-clanker-server --mode "$MODE"

      - name: Upload m1-acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-acceptance-${{ matrix.os }}
          path: target/verify/m1-acceptance.json
          if-no-files-found: warn

  m2-acceptance:
    name: m2-acceptance (${{ matrix.os }})
    # Nightly cron: always `smoke`. Manual dispatch: whatever `m2_report_mode` was
    # chosen (default `smoke`) — mirrors `m1-acceptance`'s own identical split.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-nextest binary
        id: nextest-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest*
          key: nextest-${{ matrix.os }}-0.9.143

      - name: Install cargo-nextest (WS-D10 pin)
        if: steps.nextest-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-nextest --locked --version 0.9.143

      # `rc-paritybot`'s own transitive `azalea` dependency requires a nightly Rust
      # toolchain -- identical precedent to `m1-acceptance`'s own steps above.
      - name: rc-paritybot lint (nightly override)
        working-directory: crates/testing/paritybot
        run: cargo clippy --all-targets -- -D warnings

      - name: Build rusty-clanker-server (monolithic)
        # `RUSTC_BOOTSTRAP=1`: `crates/nbt/Cargo.toml`'s own "KNOWN BLOCKER" note --
        # `simdnbt` 0.10.0 carries an unconditional `#![feature(portable_simd)]`, so
        # every command that builds `rc-nbt`/`rc-chunk-storage` (transitively, here:
        # `rusty-clanker-server` itself, and below, `xtask.exe` now that `m2_report.rs`
        # depends on both directly for its own disk-comparison leg) needs this on the
        # pinned *stable* toolchain -- a pre-existing, cross-cutting condition this
        # blueprint's own implementer does not fix workspace-wide (`gates`/`guardrails`
        # stay byte-for-byte unchanged, Deliverables), only sets locally, in this one
        # new job, for the steps that actually need it.
        env:
          RUSTC_BOOTSTRAP: "1"
        run: cargo build --release -p rusty-clanker-server --no-default-features --features monolithic

      - name: rc-paritybot test (nightly override)
        working-directory: crates/testing/paritybot
        run: cargo nextest run

      - name: m2-report
        shell: bash
        env:
          RUSTC_BOOTSTRAP: "1"
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.m2_report_mode || 'smoke' }}"
          cargo run -p xtask -- m2-report --server-bin target/release/rusty-clanker-server --mode "$MODE"

      - name: Upload m2-acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-acceptance-${{ matrix.os }}
          path: target/verify/m2-acceptance.json
          if-no-files-found: warn

  m3-acceptance:
    name: m3-acceptance (${{ matrix.os }})
    # M3-B08: TEST-D37 Tier 2 / WS-D11, restated for the unified report -- retires
    # M3-B07's own interim `redstone-parity` job (Context, "M3-B07's own interim
    # `redstone-parity` job is retired by this blueprint") and performs the identical
    # fetch-corpus + parity-check-redstone sequence *and* the 20-bot single-region
    # load-test leg together, so one job and one JSON artifact answer both of M3's
    # acceptance criteria. Present from this blueprint's own merge onward, following
    # `soak`/`m1-acceptance`/`m2-acceptance`'s identical, already-established pattern
    # -- not required to be meaningfully green until every sibling M3 component-
    # behavior blueprint has also landed and the redstone corpus has grown to >= 50
    # committed contraptions (Context, "CI tier placement"; this blueprint's own
    # Tier-1 gate never depends on this job).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show

      # TEST-D38/D41: a real Java 25+ runtime to run the pinned oracle server.jar
      # (`m3-report`'s own AC1 leg re-runs `fetch-corpus` internally) -- matches
      # M3-B07's own retired `redstone-parity` job's identical version pin.
      - name: Install Java 25+
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-nextest binary
        id: nextest-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest*
          key: nextest-${{ matrix.os }}-0.9.143

      - name: Install cargo-nextest (WS-D10 pin)
        if: steps.nextest-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-nextest --locked --version 0.9.143

      # `rc-paritybot`'s own transitive `azalea` dependency requires a nightly Rust
      # toolchain -- identical precedent to `m1-acceptance`'s/`m2-acceptance`'s own
      # steps above. Exercises `load_scenario.rs`'s own new module directly (its pure
      # layout tests included) under the nightly toolchain, rather than only ever
      # indirectly through the `load_scenario_runner` subprocess below.
      - name: rc-paritybot lint (nightly override)
        working-directory: crates/testing/paritybot
        run: cargo clippy --all-targets -- -D warnings

      - name: Build rusty-clanker-server (monolithic)
        # `RUSTC_BOOTSTRAP=1`: see `m2-acceptance`'s identical comment above --
        # `simdnbt`'s unconditional `#![feature(portable_simd)]` on this workspace's
        # pinned *stable* toolchain.
        env:
          RUSTC_BOOTSTRAP: "1"
        run: cargo build --release -p rusty-clanker-server --no-default-features --features monolithic

      - name: rc-paritybot test (nightly override)
        working-directory: crates/testing/paritybot
        run: cargo nextest run

      - name: m3-report
        shell: bash
        env:
          RUSTC_BOOTSTRAP: "1"
          RC_ORACLE_EULA_ACCEPTED: "1"
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.m3_report_mode || 'smoke' }}"
          cargo run -p xtask -- m3-report --server-bin target/release/rusty-clanker-server --mode "$MODE"

      - name: Upload m3-acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-acceptance-${{ matrix.os }}
          path: |
            target/verify/m3-acceptance.json
            target/verify/fetch-corpus.json
            target/verify/parity-check-redstone.json
            target/verify/parity-check-redstone-diffs/**
          if-no-files-found: warn

  protocol-diff:
    name: protocol-diff (${{ matrix.os }})
    # M3.5-B03 (TEST-D54): "Runs as its own scheduled CI tier next to m*-acceptance;
    # never part of Tier 1" — structurally identical to `m3-acceptance` above, never
    # required to be meaningfully green until the M3.5-B03 blueprint's own final
    # commit lands (this blueprint's own Tier-1 gate never depends on this job).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show

      # TEST-D38/D41: a real Java 25+ runtime to run the pinned oracle server.jar.
      - name: Install Java 25+
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-nextest binary
        id: nextest-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest*
          key: nextest-${{ matrix.os }}-0.9.143

      - name: Install cargo-nextest (WS-D10 pin)
        if: steps.nextest-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-nextest --locked --version 0.9.143

      # `rc-paritybot`'s own transitive `azalea` dependency requires a nightly Rust
      # toolchain — identical precedent to `m3-acceptance`'s own steps above.
      - name: rc-paritybot lint (nightly override)
        working-directory: crates/testing/paritybot
        run: cargo clippy --all-targets -- -D warnings

      - name: Build rusty-clanker-server (monolithic)
        env:
          RUSTC_BOOTSTRAP: "1"
        run: cargo build --release -p rusty-clanker-server --no-default-features --features monolithic

      - name: rc-paritybot test (nightly override)
        working-directory: crates/testing/paritybot
        run: cargo nextest run

      - name: protocol-diff
        shell: bash
        env:
          RUSTC_BOOTSTRAP: "1"
          RC_ORACLE_EULA_ACCEPTED: "1"
        run: |
          cargo run -p xtask -- protocol-diff --server-bin target/release/rusty-clanker-server --accept-eula --capture-deadline-secs 5400

      - name: Upload protocol-diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-diff-${{ matrix.os }}
          path: |
            target/verify/protocol-diff.json
            target/verify/protocol-diff-timings.json
          if-no-files-found: warn
