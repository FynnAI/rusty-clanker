[workspace]
resolver = "3"
# "crates/*" only matches one path segment (Cargo's own glob semantics, same as a
# plain shell glob) -- it does not reach crates/testing/*'s own two-level-deep dev/
# test-only members (WS-D2), so those are listed explicitly. "crates/testing" itself
# (the container directory, no Cargo.toml of its own) is excluded since "crates/*"
# would otherwise also match it directly (it now exists on disk) and fail to load.
members = [
    "crates/*",
    "crates/testing/test-harness",
    "crates/testing/paritybot",
    "crates/testing/gametest",
    "xtask",
]
exclude = ["crates/testing"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"

[workspace.dependencies]
bevy_ecs          = { version = "0.19.1", default-features = false, features = ["std"] }
crossbeam-deque   = "0.8.7"
crossbeam-utils   = "0.8.22"
crossbeam-channel = "0.5.16"
crossbeam-queue   = "0.3.13"
parking_lot       = "0.12.5"
tokio             = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "io-std"] }
bytes             = "1.12.1"
flate2            = "1.1.9"
simdnbt           = "0.10.0"
rsa               = "0.9.10"
aes               = "0.9.2"
cfb8              = "0.9.1"
sha1              = "0.11.0"
sha2              = "0.11.0"   # TEST-D47; xtask's fixture-manifest SHA-256 hashing
md-5              = "0.11.0"   # rc-auth's offline-mode UUID derivation (NET-D6 offline stance), M1-B03
uuid              = { version = "1.25.0", features = ["v4"] }   # rc-auth's offline-mode UUID type, M1-B03; "v4" for M1-B04's LoginSuccess.session_id; also rc-bedrock-auth's future UUIDv5 need
reqwest           = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
rustls            = "0.23.43"
quinn             = "0.11.11"
postcard          = "1.1.3"
openraft          = "0.9.25"
proptest          = "1.11.0"   # TEST-D27; used by rc-messaging's FIFO property test
redb              = "4.2.0"
serde             = { version = "1.0.229", features = ["derive"] }
serde_json        = "1.0.151"
toml              = "1.1.4"
ron               = "0.12.2"
thiserror         = "2.0.20"
tracing           = "0.1.44"
syn               = { version = "3.0.3", features = ["full"] }    # rc-protocol-macros/rc-entity-macros derive implementation, NET-D3
quote             = "1.0.47"    # rc-protocol-macros/rc-entity-macros derive implementation, NET-D3
proc-macro2       = "1.0.107"   # rc-protocol-macros/rc-entity-macros derive implementation, NET-D3
libloading        = "0.9.0"
wgpu              = "30.0.0"
winit             = "0.30.13"
image             = "0.25.10"
zip               = "8.6.0"
lz4_flex          = "0.14.0"
object_store      = "0.14.1"
rand_xoshiro      = "0.8.1"
rand_chacha       = "0.3.1"   # M2-B08: deterministic PRNG for the chunk-soak payload generator (Constraint (c))
wasmtime          = "36.0.13"
wasmtime-wasi     = "36.0.13"
wit-bindgen       = "0.60.0"
stabby            = "72.1.16"
kira              = "0.12.3"
cosmic-text       = "0.19.0"
swash             = "0.2.10"
etagere           = "0.3.0"
egui              = "0.36.1"
egui-wgpu         = "0.36.1"
egui-winit        = "0.36.1"
rayon             = "1.12.0"
keyring           = "4.1.6"
mimalloc          = "0.1.52"
bumpalo           = "3.20.3"
smallvec          = { version = "1.15.2", features = ["union"] }
arrayvec          = "0.7.8"
tinyvec           = "1.12.0"
lasso             = "0.7.3"
core_affinity     = "0.8.3"
pulp              = "0.22.3"
wide              = "1.6.1"
cranelift-codegen = "0.134.3"
cranelift-frontend = "0.134.3"
cranelift-jit     = "0.134.3"
io-uring          = "0.7.14"
rstar             = "0.13.0"
windows           = "0.62.2"
nix               = "0.31.3"
criterion         = "0.8.2"
# TEST-D8/TEST-D35's reviewed git-dependency exception (M1-B06): the vanilla-client
# stand-in `rc-paritybot` drives. `rev`-pinned, never a floating branch reference.
# Verified live against the pinned commit's own Cargo.toml (2026-08-25): workspace
# version "0.16.0+mc26.2", azalea-protocol::packets::PROTOCOL_VERSION == 776 -- an
# exact match for this project's own NET-D1 pin.
azalea            = { git = "https://github.com/azalea-rs/azalea", rev = "6249c295d353b9b3ef68f665b311cba39211fd19" }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "unwind"
debug = "line-tables-only"
strip = false

# M3 field-report governance fix (`crates/testing/paritybot`'s own load-test scenario,
# `load_scenario.rs`'s module doc comment, "premature-interaction defect"): azalea's own
# pathfinder (`rc-paritybot`'s vanilla-client stand-in) emits a runtime warning that an
# unoptimized (`opt-level = 0`, this workspace's own plain `[profile.dev]` default) build
# gives "significantly reduced pathfinding performance" -- confirmed directly: under a
# debug-mode `cargo run` of `load_scenario_runner` (`xtask::m3_report`'s own real
# invocation shape, never `--release` -- `crates/testing/paritybot/src/bin/
# load_scenario_runner.rs`'s own doc comment), none of the 20 concurrently-pathfinding
# bots this scenario drives on one shared `LocalSet` (`load_scenario.rs`'s own "Forced
# deviation" note) reliably completed even the one-time walk from spawn to their own
# assigned lane inside a 60-second `run_duration`. `[profile.dev.package."*"]` raises
# every *dependency*'s own opt-level -- azalea and its own dependency tree included --
# without touching this workspace's own crates (workspace members are governed by plain
# `[profile.dev]`, left at its own fast-iteration default), exactly azalea's own
# documented remedy (the warning's own referenced URL). `opt-level = 1`, not `3`: `3`
# triggers a real `rustc` internal compiler error compiling `tokio` under this project's
# own pinned nightly toolchain (`nightly-2026-07-25`) combined with this profile's own
# `debug-assertions = true` default -- confirmed directly, a known class of rustc
# codegen bug, not something either side of this workspace controls. `1` avoids it and
# is enough on its own: confirmed live (paired with `load_scenario.rs`'s own fix) to let
# every one of 20 bots complete real interaction cycles inside a 60-second run. Costs a
# slower first (cold) debug build of the dependency graph, already budgeted for:
# `xtask::m3_report`'s own `BUILD_GRACE` constant already allows 300s for "the nested
# `cargo run`'s own (possibly cold, first-ever) build."
[profile.dev.package."*"]
opt-level = 1
