[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"

[workspace.dependencies]
bevy_ecs          = { version = "0.19.1", default-features = false, features = ["std"] }
crossbeam-deque   = "0.8.7"
crossbeam-utils   = "0.8.22"
crossbeam-channel = "0.5.16"
crossbeam-queue   = "0.3.13"
parking_lot       = "0.12.5"
tokio             = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
bytes             = "1.12.1"
flate2            = { version = "1.1.9", features = ["zlib-ng"] }
simdnbt           = "0.10.0"
rsa               = "0.9.10"
aes               = "0.9.2"
cfb8              = "0.9.1"
sha1              = "0.11.0"
reqwest           = { version = "0.13.4", default-features = false, features = ["rustls-tls"] }
rustls            = "0.23.43"
quinn             = "0.11.11"
postcard          = "1.1.3"
openraft          = "0.9.25"
redb              = "4.2.0"
serde             = { version = "1.0.229", features = ["derive"] }
serde_json        = "1.0.151"
toml              = "1.1.4"
ron               = "0.12.2"
thiserror         = "2.0.20"
tracing           = "0.1.44"
libloading        = "0.9.0"
wgpu              = "30.0.0"
winit             = "0.30.13"
image             = "0.25.10"
zip               = "8.6.0"
lz4_flex          = "0.14.0"
object_store      = "0.14.1"
rand_xoshiro      = "0.8.1"
wasmtime          = "36.0.13"
wasmtime-wasi     = "36.0.13"
wit-bindgen       = "0.60.0"
stabby            = "72.1.16"
kira              = "0.12.3"
cosmic-text       = "0.19.0"
swash             = "0.2.10"
etagere           = "0.3.0"
egui              = "0.36.1"
egui-wgpu         = "0.36.1"
egui-winit        = "0.36.1"
rayon             = "1.12.0"
keyring           = "4.1.6"
mimalloc          = "0.1.52"
bumpalo           = "3.20.3"
smallvec          = { version = "1.15.2", features = ["union"] }
arrayvec          = "0.7.8"
tinyvec           = "1.12.0"
lasso             = "0.7.3"
core_affinity     = "0.8.3"
pulp              = "0.22.3"
wide              = "1.6.1"
cranelift-codegen = "0.134.3"
cranelift-frontend = "0.134.3"
cranelift-jit     = "0.134.3"
io-uring          = "0.7.14"
rstar             = "0.13.0"
windows           = "0.62.2"
nix               = "0.31.3"
criterion         = "0.8.2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "unwind"
debug = "line-tables-only"
strip = false
