[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
xshell = "0.2.7"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
# M1-B06: `m1_report`'s in-process probe/process-orchestration calls only -- never
# `rc-paritybot` (Context, "azalea's own upstream nightly-toolchain requirement"; this
# crate's own binary must never link `azalea`/`simdnbt`).
rc-test-harness = { path = "../crates/testing/test-harness" }
# M2-B08: `m2_report`'s own direct on-disk comparison leg (Context's "Direct on-disk
# comparison") -- opens a fresh `AnvilDiskBackend`/`FilesystemPlayerDataStore` and
# decodes chunk/player NBT in-process. None of these four pull in `azalea`/nightly-only
# code (unlike `rc-paritybot`), so linking them into `xtask.exe` is safe under this
# project's pinned stable toolchain (WS-D4).
rc-chunk-storage = { path = "../crates/chunk-storage" }
rc-nbt = { path = "../crates/nbt" }
rc-core = { path = "../crates/core" }
rc-registries = { path = "../crates/registries" }
# M2-B08: `restart_persistence_runner`'s own offline username maps to the same
# on-disk player-data UUID the server itself derives (NET-D6's offline-mode scheme) --
# reused directly rather than re-implemented, so a drift in that derivation can never
# silently desync the disk-comparison leg from the real file the server actually wrote.
rc-auth = { path = "../crates/auth" }
uuid = { workspace = true }
# M3-B07: `corpus::parity_check`'s own in-process replay/diff leg
# (`rc_gametest::{replay, trace, spec}`) — safe to link directly into `xtask.exe`
# under this project's pinned *stable* toolchain (WS-D4) because `rc-gametest` never
# depends on `rc-paritybot`/`azalea` (that crate's own `Cargo.toml` doc comment has
# the full citation). `corpus::fetch_corpus`'s own live-oracle capture leg needs a
# real bot connection and is therefore never linked here — it drives
# `rc-paritybot`'s new `fetch_corpus_runner` bin target as a subprocess instead,
# mirroring `m1_report`/`m2_report`'s own already-established pattern exactly.
rc-gametest = { path = "../crates/testing/gametest" }
# M3.5-B05: `m3_5_be_report`'s own direct on-disk block-entity seeding/verification
# legs (Context 2.2: "the only way, absent a container-open channel, to establish
# 'a player filled these containers' as a starting condition") — real production
# `BlockEntityCodec` impls, called in-process exactly like `m2_report.rs`'s own
# `ChunkNbtCodec` disk-comparison leg above. `rc-mechanics` never depends on
# `azalea`/nightly-only code (unlike `rc-paritybot`), so linking it into `xtask.exe`
# is safe under this project's pinned stable toolchain (WS-D4), identical reasoning
# to `rc-chunk-storage` above.
rc-mechanics = { path = "../crates/mechanics" }
