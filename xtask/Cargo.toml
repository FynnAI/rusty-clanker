[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
xshell = "0.2.7"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
# M1-B06: `m1_report`'s in-process probe/process-orchestration calls only -- never
# `rc-paritybot` (Context, "azalea's own upstream nightly-toolchain requirement"; this
# crate's own binary must never link `azalea`/`simdnbt`).
rc-test-harness = { path = "../crates/testing/test-harness" }
