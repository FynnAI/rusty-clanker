[profile.default]
retries = 0
fail-fast = false

[profile.default.junit]
path = "junit.xml"

[profile.ci-nightly]
retries = 1
fail-fast = false

[profile.ci-nightly.junit]
path = "junit.xml"

# Heavy multiplayer integration binaries: each test spawns a full HardcodedWorld
# (its own region tick thread, real TCP sockets, several tokio runtimes). Running
# many of them concurrently on a 2-core CI runner starves the region tick threads
# and trips staged hang-guards that are generous for any sane load - the CI flake
# family of 2026-08-30/31 was exactly this self-contention, not product races
# (those were found and fixed separately). Cap their concurrency instead of
# inflating budgets further.
[test-groups.heavy-server-integration]
max-threads = 2

# Membership by package, not by an explicit binary list (M3 field-report governance,
# 2026-09-02): the explicit list silently excluded every real-connection test binary
# added after it was written -- eight new files landed in one day (creative-hotbar,
# block-state orientation, redstone field report, block-entity chunk list, tick log,
# chunk churn, ...) and ran unthrottled alongside the throttled ones, reproducing the
# exact 2026-08-30/31 starvation on BOTH CI legs at once. Every integration binary of
# the server crate spawns at least one HardcodedWorld; the handful that don't lose
# nothing by sharing the cap.
[[profile.default.overrides]]
filter = 'package(rusty-clanker-server) & kind(test)'
test-group = 'heavy-server-integration'
